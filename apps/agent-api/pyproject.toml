[tool.poetry]
name = "asio-agent-api"
version = "2.0.0"
description = "ARIA — ASIO Research & Intelligence Agent API"
authors = ["ASIO Team <dev@asiomarketing.com>"]
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
groq = "^0.9.0"
anthropic = "^0.30.0"
python-telegram-bot = { extras = ["job-queue"], version = "^21.0" }
httpx = "^0.27.0"
python-dotenv = "^1.0.0"
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
