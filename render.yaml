services:
  - type: web
    name: asio-agent-api
    runtime: docker
    dockerfilePath: apps/agent-api/Dockerfile
    plan: starter
    region: ohio   # Más cercano a México
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: GROQ_API_KEY
        sync: false   # Set via Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: asio_verify_2025
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
